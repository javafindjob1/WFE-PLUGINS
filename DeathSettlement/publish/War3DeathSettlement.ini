; 魔兽死亡结算 War3DeathSettlement 设置（改完保存即可，下次启动生效）
; interval_ms   : 轮询间隔毫秒（10~5000）
; deep_seconds  : 深度扫描间隔秒；0 = 关闭（关闭后不再发现新单位）
; auto_attach   : 1 = 启动后自动找游戏
; last_process_name : 上次连接的进程名（自动连接会一并尝试它）
; force_version : 非空则强制用这个版本的地址表，例如 1.27.0.52240
; read_plugin_log : 1 = 读游戏内插件日志，把“伤害来源/攻击类型”补进结算（插件在跑才有）
; plugin_log_path : 插件日志路径

interval_ms=50
deep_seconds=8
auto_attach=1
last_process_name=
force_version=
read_plugin_log=0
plugin_log_path=C:\3rd\wc3gamesearcher\WFE\Application\Libraries\UDamageWatcher.log
atype_labels=
dtype_labels=
